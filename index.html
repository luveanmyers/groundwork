<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SetOut</title>

  <!-- Makes the app installable and gives iOS the info it needs for
       "Add to Home Screen" to behave like a real standalone app. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FAF7F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SetOut" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/favicon-32.png" />

  <!-- SetOut wordmark font, scoped to the header lockup only -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=Yeseva+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Everything on screen is generated into this single div by app.js.
       See app.js's render() function for how that works. -->
  <div id="app"></div>

  <!-- Line-icon sprite, referenced via <use href="#i-..."> from app.js.
       Lives outside #app since app.js replaces #app's innerHTML wholesale
       on every render() - this block stays untouched across re-renders. -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-land" viewBox="0 0 24 24"><path d="M3 17.6 8.5 8.3c.3-.5 1-.5 1.3 0l2.6 4.5 1.7-2.6c.3-.5 1-.5 1.3 0l5.1 7.4"/><circle cx="16.6" cy="6.4" r="1.5"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M2.5 10.4c1.6-1.3 3.2-1.3 4.8 0s3.2 1.3 4.8 0 3.2-1.3 4.8 0 3.2 1.3 4.8 0"/><path d="M2.5 15.3c1.6-1.3 3.2-1.3 4.8 0s3.2 1.3 4.8 0 3.2-1.3 4.8 0 3.2 1.3 4.8 0"/></symbol>
    <symbol id="i-culture" viewBox="0 0 24 24"><path d="M7.5 20V6.3H9.3V8H11.1V6.3H12.9V8H14.7V6.3H16.5V20"/><path d="M10.7 20v-2.7a1.3 1.3 0 0 1 2.6 0V20"/><path d="M12 6.3V3.9"/><path d="M12 3.9l2.3.9-2.3.9"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M7.8 3.4h8.4c0 4.2-1.8 6.9-4.2 6.9S7.8 7.6 7.8 3.4Z"/><path d="M12 10.3v7.9"/><path d="M8.2 20.5h7.6"/></symbol>
    <symbol id="i-explore" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M15.3 8.5 13 13l-4.3 2.5L11 11z"/></symbol>
    <symbol id="i-other" viewBox="0 0 24 24"><path d="M12 3.4v17.2"/><path d="M4 8.2l16 7.6"/><path d="M20 8.2 4 15.8"/></symbol>
  </svg>

  <!-- Load order matters: storage.js defines the data functions that
       app.js calls, so it has to load first. -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
