<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Groundwork</title>

  <!-- Makes the app installable and gives iOS the info it needs for
       "Add to Home Screen" to behave like a real standalone app. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Groundwork" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Everything on screen is generated into this single div by app.js.
       See app.js's render() function for how that works. -->
  <div id="app"></div>

  <!-- Load order matters: storage.js defines the data functions that
       app.js calls, so it has to load first. -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
